<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuesta C · Lookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,600;0,700;0,800;0,900;1,900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<script src="datos.js"></script>
<style>
:root{--negro:#0b0b0b;--fondo:#EFEDE9;--talla:#8C6A4A}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--negro);background:var(--fondo)}
.cab{text-align:center;padding:34px 18px 8px}
.cab h1{margin:0;font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:54px;letter-spacing:-1px;line-height:1}
.cab p{margin:10px 0 0;font:600 11px Inter;letter-spacing:5px}
.icos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:22px 16px 6px;border-top:1px solid rgba(0,0,0,.18);border-bottom:1px solid rgba(0,0,0,.18)}
.icos div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;font:600 11px Inter;text-align:center;line-height:1.2}
.icos div+div{border-left:1px solid rgba(0,0,0,.18)}
.icos i{width:38px;height:38px;border-radius:50%;background:var(--negro);display:grid;place-items:center}
.filtros{display:flex;gap:18px;overflow-x:auto;padding:16px 18px 10px;scrollbar-width:none;font:700 14px Inter}
.filtros span{flex:none;color:rgba(11,11,11,.45)}
.filtros span.on{color:var(--negro);border-bottom:2px solid var(--negro);padding-bottom:4px}
.lista{padding:6px 16px 120px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
.p.grande{grid-column:1 / -1}
.p .img{aspect-ratio:4/5;background:#ddd center/cover no-repeat;border-radius:4px}
.p.grande .img{aspect-ratio:4/3.6}
.p .inf{display:flex;justify-content:space-between;align-items:flex-end;padding-top:10px;gap:10px}
.p .id{font:600 11px Inter;letter-spacing:2px;color:rgba(11,11,11,.55)}
.p .m{display:block;font-style:italic;font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:-.5px;line-height:1.05;margin-top:2px}
.p.grande .m{font-size:30px}
.p .t{color:var(--talla);font-weight:700;font-size:14px;margin-left:6px;font-style:normal}
.p .pr{font-family:'Playfair Display',serif;font-style:italic;font-size:26px;white-space:nowrap}
.p.grande .pr{font-size:38px}
.pie{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--negro);color:#fff}
.pie em{font-family:'Playfair Display',serif;font-size:20px}
.pie a{display:flex;gap:8px;align-items:center;background:#fff;color:var(--negro);border-radius:999px;padding:11px 16px;font:700 14px Inter;text-decoration:none}
</style>
</head>
<body>
<header class="cab"><h1>ECUMarket</h1><p>100% ORIGINALES</p></header>
<div class="icos" id="icos"></div>
<nav class="filtros"><span class="on">Todo</span><span>Calzado</span><span>Ropa</span><span>Talla ▾</span><span>Para quién ▾</span></nav>
<main class="lista" id="rej"></main>
<div class="pie"><em>Originales, siempre.</em><a href="#" id="wa"></a></div>
<script>
var I = {
  orig: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z M8.5 12l2.5 2.5 4.5-5',
  unico: 'M12 3.5a8.5 8.5 0 1 0 0.01 0z M10.5 9.5L12 8v8',
  nuevo: 'M12 3l2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 14.8 7.4 17.3l.9-5.2L4.5 8.5l5.2-.7z',
  wa: 'M4 20l1.3-4A8 8 0 1 1 8 18.7z M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z'
};
function ico(k) { return '<i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + I[k] + '"/></svg></i>'; }
document.getElementById('icos').innerHTML = [['orig', 'Producto<br>original'], ['unico', 'Pieza<br>única'], ['nuevo', 'Nuevo<br>sin uso'], ['wa', 'Reserva<br>fácil']].map(function (x) { return '<div>' + ico(x[0]) + x[1] + '</div>'; }).join('');
document.getElementById('wa').innerHTML = WA + 'WhatsApp';
document.getElementById('rej').innerHTML = MUESTRA.map(function (p, k) {
  return '<article class="p' + (k % 5 === 0 ? ' grande' : '') + '"><div class="img" style="background-image:url(' + fotoUrl(p.foto, k % 5 === 0 ? 1000 : 600) + ')"></div>' +
    '<div class="inf"><div><span class="id">Nº ' + p.id + '</span><span class="m">' + p.marca + '<span class="t">' + p.talla + '</span></span></div><span class="pr">$' + p.precio + '</span></div></article>';
}).join('');
</script>
</body>
</html>
